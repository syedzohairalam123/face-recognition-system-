[project]
name = "face-attendance-system"
version = "1.0.0"
description = "Face Recognition Attendance System"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "werkzeug>=3.0.0",
    "openpyxl>=3.1.0",
    "opencv-python-headless>=4.8.0,<5.0.0",
    "numpy>=1.24.0",
    "dlib>=19.24.0",
    "face-recognition>=1.3.0",
]

[tool.vercel]
entrypoint = "api/index.py"